dding:.2rem;flex-shrink:0;line-height:1}#toast-close-btn:hover{color:#475569}#gps-status-btn{position:fixed;top:1rem;right:1rem;z-index:9000;background:#fff;border:none;border-radius:50px;padding:.4rem .9rem;font-size:.72rem;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;gap:.4rem;transition:background .2s}#gps-status-btn.active{background:#dcfce7;color:#166534}#gps-status-btn.error{background:#fee2e2;color:#b91c1c}</style><style>:root{--bg-color:#f8fafc;--text-main:#0f172a;--text-muted:#64748b;--accent:#059669}body{font-family:Manrope,sans-serif;background:var(--bg-color);color:var(--text-main);margin:0;padding:0}.container{max-width:800px;margin:0 auto;padding:2rem 1rem}.header{background:#fff;padding:2rem;border-radius:16px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);margin-bottom:2rem}.header h1{margin:0 0 .5rem 0;font-size:2rem;color:var(--text-main)}.meta{color:var(--text-muted);font-size:1rem;display:flex;gap:1rem;align-items:center}#map{width:100%;height:400px;border-radius:16px;margin-bottom:2rem;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);z-index:1}.timeline{position:relative;padding-left:2rem;margin-top:2rem}.timeline::before{content:'';position:absolute;left:.5rem;top:0;bottom:0;width:2px;background:#e2e8f0}.point-card{background:#fff;padding:1.5rem;border-radius:12px;margin-bottom:1.5rem;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.05)}.point-card::before{content:'';position:absolute;left:-1.85rem;top:1.5rem;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent)}.point-card h3{margin:0 0 .5rem 0;font-size:1.25rem}.point-card p{margin:0;color:var(--text-muted);line-height:1.5}.media-container{margin-top:1rem}.media-container img{max-width:100%;border-radius:8px}#lock-screen{display:none;text-align:center;background:#fff;padding:3rem 2rem;border-radius:16px;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);margin-top:2rem}#lock-screen input{padding:.75rem 1rem;font-size:1rem;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:1rem;width:100%;max-width:300px}#lock-screen button{padding:.75rem 1.5rem;background:#e11d48;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}#content-area{display:none}</style></head><body><div class="container"><a href="javascript:history.back()" style="display:inline-flex;align-items:center;gap:.5rem;color:var(--text-muted);text-decoration:none;margin-bottom:1rem;font-weight:600"><span class="iconify" data-icon="material-symbols:arrow-back"></span> Palaa</a><div class="header"><div id="route-badge" style="display:inline-block;padding:.2rem .6rem;background:#ecfdf5;color:#059669;border-radius:50px;font-size:.8rem;font-weight:700;margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.5px">Reitti</div><h1 id="route-title">Ladataan reittiä...</h1><div class="meta"><span id="route-place"><span class="iconify" data-icon="material-symbols:location-on"></span> ...</span> <span id="route-distance"><span class="iconify" data-icon="material-symbols:route"></span> ...</span></div><p id="route-desc" style="margin-top:1rem;color:var(--text-muted);line-height:1.5"></p></div><div id="lock-screen"><span class="iconify" data-icon="material-symbols:lock" style="font-size:3rem;color:#e11d48;margin-bottom:1rem"></span><h2 style="margin:0 0 .5rem 0">Suojattu elämyspolku</h2><p style="color:var(--text-muted);margin-bottom:2rem">Tämä reitti on käytettävissä pääsykoodilla.</p><div style="display:flex;flex-direction:column;align-items:center;gap:.5rem"><input type="password" id="access-code" placeholder="Syötä pääsykoodi"> <button id="btn-unlock">Avaa reitti</button><div id="unlock-error" style="color:#e11d48;font-size:.9rem;margin-top:.5rem;display:none">Virheellinen koodi. Yritä uudelleen.</div></div></div><div id="content-area"><div id="map"></div><h2 style="margin-top:3rem;margin-bottom:1rem">Kokemuspisteet <span id="point-count" style="color:var(--text-muted);font-size:1.2rem;font-weight:400"></span></h2><div class="timeline" id="points-list"></div></div></div><div id="point-modal" class="lki-modal-overlay"><div class="lki-modal-container"><button class="lki-modal-close" id="point-modal-close">&times;</button><div id="point-modal-media-container" class="lki-modal-media" style="display:none"></div><div class="lki-modal-body"><h2 id="point-modal-title" class="lki-modal-title"></h2><div id="point-modal-desc" class="lki-modal-description"></div><div id="point-modal-link-container" class="lki-modal-footer"></div></div></div></div><button id="gps-status-btn" onclick="window.toggleGPS&&window.toggleGPS()" title="GPS-seuranta"><span id="gps-dot">📍</span> <span id="gps-label">GPS pois</span></button><div id="proximity-toast"><div id="toast-icon">📍</div><div id="toast-body"><div id="toast-label">Olet lähellä kohdetta</div><div id="toast-point-name">...</div><div id="toast-point-dist"></div></div><button id="toast-open-btn">Avaa →</button> <button id="toast-close-btn">✕</button></div><script src="reitti.d523fe07.js"></script></body></html>
