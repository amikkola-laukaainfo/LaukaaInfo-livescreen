<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laukaan tilannekuva · LaukaaInfo</title>
    <meta name="description" content="Laukaan kunnan ja taajamien yhteinen tilannekuva: paikat, tapahtumat, reitit ja ajankohtaiset sisällöt.">
    <link rel="icon" href="logo.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- LaukaaInfo perus-CSS -->
    <link rel="stylesheet" href="style.css?v=20260622">

    <style>
        :root {
            --tk-bg: #0b1329;
            --tk-card-bg: rgba(22, 34, 62, 0.85);
            --tk-card-hover: rgba(30, 48, 88, 0.95);
            --tk-border: rgba(255, 255, 255, 0.08);
            --tk-border-glow: rgba(45, 212, 191, 0.25);
            --tk-text-main: #f8fafc;
            --tk-text-muted: #94a3b8;
            --tk-accent-teal: #2dd4bf;
            --tk-accent-sky: #38bdf8;
            --tk-accent-indigo: #818cf8;
            --tk-pill-bg: rgba(45, 212, 191, 0.12);
        }

        body {
            background-color: var(--tk-bg);
            color: var(--tk-text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ── YLÄPALKKI / HEADER ───────────────────────────────────────── */
        .site-header {
            background: rgba(11, 19, 41, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--tk-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .brand-logo span { color: var(--tk-accent-teal); }
        .nav-links { display: flex; gap: 1.25rem; list-style: none; margin: 0; padding: 0; }
        .nav-links a { color: var(--tk-text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; }

        /* ── PÄÄSISÄLTÖ ───────────────────────────────────────────────── */
        .tk-page-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* ── HEADER CARD ──────────────────────────────────────────────── */
        .tk-header-card {
            background: linear-gradient(135deg, rgba(20, 36, 70, 0.9) 0%, rgba(13, 24, 48, 0.95) 100%);
            border: 1px solid var(--tk-border);
            border-radius: 18px;
            padding: 2rem 2.2rem;
            margin-bottom: 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1.5rem;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }
        .tk-breadcrumb {
            font-size: 0.85rem;
            color: var(--tk-text-muted);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .tk-crumb-item {
            cursor: pointer;
            transition: color 0.2s;
        }
        .tk-crumb-item:hover { color: var(--tk-accent-teal); }
        .tk-crumb-item.active { color: var(--tk-accent-teal); font-weight: 600; cursor: default; }
        .tk-crumb-sep { opacity: 0.5; }

        .tk-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2rem, 4vw, 2.7rem);
            font-weight: 800;
            margin: 0 0 0.4rem;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #fff 40%, var(--tk-accent-sky) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tk-subtitle {
            margin: 0;
            color: #cbd5e1;
            font-size: 1.05rem;
            max-width: 650px;
            line-height: 1.5;
        }
        .tk-header-actions { display: flex; gap: 0.75rem; align-items: center; }

        /* ── BUTTONS ──────────────────────────────────────────────────── */
        .tk-btn {
            border: none;
            border-radius: 10px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .tk-btn-primary {
            background: var(--tk-accent-teal);
            color: #042f2e;
        }
        .tk-btn-primary:hover { background: #5eead4; transform: translateY(-1px); }
        .tk-btn-secondary {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--tk-border);
            color: #fff;
        }
        .tk-btn-secondary:hover { background: rgba(255,255,255,0.15); }
        .tk-btn-ghost {
            background: transparent;
            color: var(--tk-text-muted);
            border: 1px solid var(--tk-border);
        }
        .tk-btn-ghost:hover { color: #fff; border-color: rgba(255,255,255,0.25); }

        /* ── METRICS GRID ─────────────────────────────────────────────── */
        .tk-metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 1rem;
            margin-bottom: 2.2rem;
        }
        .tk-metric-card {
            background: var(--tk-card-bg);
            border: 1px solid var(--tk-border);
            border-radius: 14px;
            padding: 1.25rem 1rem;
            text-align: center;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
        }
        .tk-metric-card:hover {
            border-color: var(--tk-border-glow);
            transform: translateY(-2px);
        }
        .tk-metric-icon { font-size: 1.6rem; margin-bottom: 0.35rem; }
        .tk-metric-num {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.1;
        }
        .tk-metric-label {
            font-size: 0.8rem;
            color: var(--tk-text-muted);
            margin-top: 0.35rem;
            font-weight: 500;
        }

        /* ── SECTION & TAAJAMAKORTIT ─────────────────────────────────── */
        .tk-section {
            margin-bottom: 2.5rem;
        }
        .tk-section-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        .tk-section-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            margin: 0;
            color: #fff;
        }
        .tk-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--tk-accent-sky);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 999px;
            padding: 0.2rem 0.65rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .tk-section-desc {
            color: var(--tk-text-muted);
            font-size: 0.95rem;
            margin: 0 0 1.25rem;
        }

        .tk-subareas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }
        .tk-area-card {
            background: var(--tk-card-bg);
            border: 1px solid var(--tk-border);
            border-radius: 14px;
            padding: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tk-area-card:hover {
            background: var(--tk-card-hover);
            border-color: var(--tk-border-glow);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -8px rgba(45, 212, 191, 0.25);
        }
        .tk-area-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .tk-area-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
            color: #fff;
        }
        .tk-area-arrow {
            color: var(--tk-accent-teal);
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        .tk-area-card:hover .tk-area-arrow {
            transform: translateX(3px);
        }
        .tk-area-stats {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .tk-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--tk-border);
            border-radius: 999px;
            padding: 0.25rem 0.65rem;
            font-size: 0.78rem;
            color: #cbd5e1;
            font-weight: 500;
        }
        .tk-pill-highlight {
            background: rgba(45, 212, 191, 0.12);
            border-color: rgba(45, 212, 191, 0.35);
            color: var(--tk-accent-teal);
            font-weight: 600;
        }

        /* ── PULSE PANELS (TAPAHTUMAT, MUISTOT, KOHTAAMISET) ──────────── */
        .tk-pulse-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .tk-panel {
            background: var(--tk-card-bg);
            border: 1px solid var(--tk-border);
            border-radius: 16px;
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
        }
        .tk-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--tk-border);
        }
        .tk-panel-header h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            color: #fff;
        }
        .tk-count {
            background: rgba(255,255,255,0.06);
            color: var(--tk-text-muted);
            border-radius: 999px;
            padding: 0.15rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .tk-item-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }
        .tk-event-item, .tk-memory-item, .tk-encounter-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            transition: all 0.2s;
        }
        .tk-event-item:hover, .tk-memory-item:hover, .tk-encounter-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .tk-item-time, .tk-item-date {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
            font-size: 0.78rem;
            color: var(--tk-text-muted);
        }
        .tk-context-pill {
            background: rgba(56, 189, 248, 0.15);
            color: var(--tk-accent-sky);
            border-radius: 4px;
            padding: 0.1rem 0.45rem;
            font-weight: 600;
        }
        .tk-item-badge {
            display: inline-block;
            background: rgba(129, 140, 248, 0.15);
            color: var(--tk-accent-indigo);
            border-radius: 4px;
            padding: 0.1rem 0.45rem;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            text-transform: uppercase;
        }
        .tk-item-title {
            margin: 0 0 0.3rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #f1f5f9;
        }
        .tk-item-meta {
            font-size: 0.8rem;
            color: var(--tk-text-muted);
        }
        .tk-item-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin: 0.2rem 0 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .tk-empty-state {
            padding: 2.5rem 1rem;
            text-align: center;
            color: var(--tk-text-muted);
            font-size: 0.9rem;
            font-style: italic;
        }

        /* ── LOADING & ERROR STATES ───────────────────────────────────── */
        .tk-loading-wrap {
            padding: 5rem 1rem;
            text-align: center;
            color: var(--tk-text-muted);
        }
        .tk-spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--tk-accent-teal);
            border-radius: 50%;
            animation: tk-spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes tk-spin { to { transform: rotate(360deg); } }

        .tk-error-card {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 14px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            max-width: 500px;
            margin: 3rem auto;
        }
        .tk-error-icon { font-size: 2.2rem; margin-bottom: 0.5rem; }
        .tk-error-card h3 { color: #f87171; margin: 0 0 0.5rem; }
        .tk-error-card p { color: #cbd5e1; font-size: 0.95rem; margin-bottom: 1.5rem; }
        .tk-btn-row { display: flex; gap: 0.75rem; justify-content: center; }

        @media (max-width: 640px) {
            .tk-header-card { padding: 1.4rem; }
            .tk-metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .tk-pulse-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- YLÄPALKKI -->
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">Laukaa<span>Info</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Etusivu</a></li>
                <li><a href="tilannekuva.html" class="active">Tilannekuva</a></li>
                <li><a href="koko-laukaa.html">Palvelut &amp; kohteet</a></li>
                <li><a href="asiahaku.html">Teemat</a></li>
                <li><a href="ajankohtaista.html">Ajankohtaista</a></li>
            </ul>
        </div>
    </header>

    <!-- PÄÄSISÄLTÖ -->
    <main class="tk-page-wrap">
        <div id="dashboard-root">
            <!-- dashboardController.js renderöi sisällön tähän -->
        </div>
    </main>

    <!-- Supabase JS & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="placeContext.js"></script>

    <!-- Tilannekuvan ohjain -->
    <script src="dashboardController.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.dashboard = new DashboardController({
                containerId: 'dashboard-root'
            });
            window.dashboard.init();
        });
    </script>
</body>
</html>
